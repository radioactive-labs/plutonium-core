name: Ruby

on:
  push:
    branches:
      - master

  pull_request:

# Both jobs only check out the repo and run read-only checks; grant the
# GITHUB_TOKEN the minimal contents:read scope (CodeQL: missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.3"
          - "3.4"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Format ruby
        run: bundle exec standardrb
      - name: Analyze ruby
        run: bundle exec brakeman -i config/brakeman.ignore --no-pager
      - name: Audit bundle
        run: bundle exec bundle-audit

  test:
    runs-on: ubuntu-latest
    name: Tests (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      matrix:
        rails:
          - "rails-7"
          - "rails-8.0"
          - "rails-8.1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install appraisal gemfiles
        run: bundle exec appraisal install
      - name: Unit tests
        run: bundle exec appraisal ${{ matrix.rails }} rake test
      # System tests are a SEPARATE task: the Rakefile's default `test` task
      # excludes test/system/**, so a green `rake test` says nothing about the
      # browser-driven suite. They are the only gate on the Stimulus controllers
      # (drag-to-reorder, kanban drops) — the Ruby suite never executes that JS.
      - name: System tests
        run: bundle exec appraisal ${{ matrix.rails }} rake test:system

  generators:
    runs-on: ubuntu-latest
    name: Generators
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install appraisal gemfiles
        run: bundle exec appraisal install
      # Under appraisal, not the root bundle: the generator tests boot the dummy
      # app, whose initializers need gems (rodauth-rails and friends) that only
      # the appraisal gemfiles carry. On the root Gemfile every file dies at
      # `uninitialized constant Rodauth`.
      #
      # Also excluded from the default task, and destructive — it git-cleans
      # test/dummy — so it gets its own job rather than sharing a checkout.
      - name: Generator tests
        run: bundle exec appraisal rails-8.1 rake test_generators

  positioning-postgres:
    runs-on: ubuntu-latest
    name: Positioning on PostgreSQL
    env:
      BUNDLE_GEMFILE: gemfiles/postgres.gemfile
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plutonium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq (for the pg native gem)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify Plutonium::Positioning + t.position on PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/plutonium_test
        run: bundle exec ruby test/positioning_postgres_check.rb
